
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobmate-mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jobmate-mysql
  template:
    metadata:
      labels:
        app: jobmate-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "jobmate123"
            - name: MYSQL_DATABASE
              value: "jobmate_db"
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-storage
          emptyDir: {}
