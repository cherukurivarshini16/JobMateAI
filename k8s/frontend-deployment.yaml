
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobmate-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jobmate-frontend
  template:
    metadata:
      labels:
        app: jobmate-frontend
    spec:
      containers:
        - name: frontend
          image: jobmate-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
