
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobmate-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jobmate-backend
  template:
    metadata:
      labels:
        app: jobmate-backend
    spec:
      containers:
        - name: backend
          image: jobmate-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
